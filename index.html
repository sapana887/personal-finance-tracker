<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="/">💰 Finance Tracker</a>
    <a href="/">Dashboard</a>
  </nav>
  <main>
  <h1>Personal finance Tracker</h1>
  <p>Keep Track of your income and expenses</p>
  <div class="container">
    <div class="finance-card">
      <h2>Total income</h2>
      <p>Rs. 50,000</p>
    </div>
    <div class="finance-card">
      <h2>Total expense</h2>
      <p>Rs. 20,000</p>
    </div>
    <div class="finance-card">
      <h2>Balance</h2>
      <p>Rs. 30,000</p>
    </div>
  </div>
  <div class="box">
    <h2>Financial status</h2>
    <p>✓ You have savings</p>
  </div>
  <div class="summary">
    <h2>Today's Summary</h2>
    <p>Income: Rs. 50,000</p>
    <p>Expenses: Rs. 20,000</p>
    <p>Remaining: Rs. 30,000 </p>
  </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
